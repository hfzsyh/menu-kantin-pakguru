<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kantin Sehat - Menu Makanan & Minuman</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="container header-inner">
      <a href="#" class="logo">🍴 Pak<span>Guru</span></a>
      <button class="cart-btn" id="openCart" aria-label="Buka keranjang">
        🛒 Keranjang
        <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <div class="container">
      <h1>Lapar? Pesan Saja dari Kursi Anda!</h1>
      <p>Pilih menu favorit, masukkan ke keranjang, dan pesanan siap diantar ke meja.</p>
    </div>
  </section>

  <!-- MENU -->
  <main class="container">
    <div class="toolbar">
      <div class="filters" id="filters">
        <button class="chip active" data-kategori="semua">Semua</button>
        <button class="chip" data-kategori="makanan">🍛 Makanan</button>
        <button class="chip" data-kategori="minuman">🥤 Minuman</button>
      </div>
      <div class="controls">
        <input type="search" id="search" placeholder="Cari menu...">
        <select id="sort" aria-label="Urutkan menu">
          <option value="default">Urutkan</option>
          <option value="rating">Rating tertinggi</option>
          <option value="murah">Harga termurah</option>
          <option value="mahal">Harga termahal</option>
        </select>
      </div>
    </div>

    <div class="menu-grid" id="menuGrid"></div>
    <p class="empty" id="emptyMsg" hidden>Menu tidak ditemukan 😢</p>
  </main>

  <footer class="footer">
    <p>© 2026 Kantin PakGuru · Buka setiap hari 07.00 – 02.00</p>
  </footer>

  <!-- KERANJANG (drawer) -->
  <div class="overlay" id="overlay"></div>
  <aside class="cart" id="cart" aria-label="Keranjang belanja">
    <div class="cart-head">
      <h2>Keranjang Anda</h2>
      <button class="close" id="closeCart" aria-label="Tutup keranjang">✕</button>
    </div>

    <div class="cart-items" id="cartItems"></div>

    <div class="cart-foot" id="cartFoot">
      <div class="total-row">
        <span>Total</span>
        <strong id="cartTotal">Rp 0</strong>
      </div>
      <input type="text" id="namaPemesan" placeholder="Nama pemesan" maxlength="40">
      <input type="text" id="nomorMeja" placeholder="Nomor meja (contoh: 5)" maxlength="10">
      <textarea id="catatan" placeholder="Catatan (opsional), mis. tanpa pedas" rows="2" maxlength="120"></textarea>
      <button class="btn-checkout" id="checkoutBtn">Pesan Sekarang</button>
      <button class="btn-clear" id="clearBtn">Kosongkan Keranjang</button>
    </div>
  </aside>

  <!-- MODAL KONFIRMASI -->
  <div class="modal" id="modal" hidden>
    <div class="modal-box">
      <div class="modal-icon">✅</div>
      <h2>Pesanan Diterima!</h2>
      <p id="modalInfo"></p>
      <ul id="modalList"></ul>
      <p class="modal-total" id="modalTotal"></p>
      <button class="btn-checkout" id="modalClose">Tutup</button>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
